<mat-dialog-content>
    <mat-card>

        <!--mat-card-header-->
        <div>
            <button matFab extended (click)="clearCanvas()" style="background-color: var(--mat-sys-error-container);
                    color: var(--mat-sys-on-error-container);float: right;">
                <mat-icon>delete_forever</mat-icon>
                Clear All
            </button>

            <button matFab extended (click)="toggleDraw()">
                <mat-icon>{{drawMode()==="draw"?"ink_eraser":"edit"}}</mat-icon>
                {{drawMode()==="draw"?"Eraser":"Pen"}}
            </button>
            <mat-slider [min]="drawMode()==='draw'?1:0" [max]="drawMode()==='draw'?10:100"
                [step]="drawMode()==='draw'?1:10" discrete showTickMarks style="margin: auto 20px;">
                <input matSliderThumb (valueChange)="setBrushSize($event)" #slider [value]="brushSize()">
            </mat-slider>
        </div>
        <!--/mat-card-header-->

        <mat-card-content>
            <div id="pointer" #pointerDiv></div>
            <canvas id="board" #myCanvas (pointerdown)="start($event)" (pointerup)="stop($event)"
                (pointermove)="drawMode() === 'draw' ? draw($event) : erase($event)"
                (pointerleave)="onPointerLeave($event)" style="margin: 16px 0 0 0;">
            </canvas>
        </mat-card-content>

    </mat-card>

    <mat-dialog-actions>
        <button matButton mat-dialog-close>Cancel</button>
        <button matButton="filled" (click)="onSubmitImage()">Submit</button>
    </mat-dialog-actions>
</mat-dialog-content>
