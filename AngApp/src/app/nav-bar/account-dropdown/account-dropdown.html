<button matIconButton [matMenuTriggerFor]="menu()" [style]="userAccService.myProfileInfo.hasValue() ? imgBtnStyle : ''">
    @if(userAccService.myProfileInfo.value()?.avatarUrl){
    <img [ngSrc]="userAccService.myProfileInfo.value()!.avatarUrl!" priority width="40" height="40" alt="user avatar"
        [matTooltip]="identityService.myIdentityInfo()?.userName">
    }
    @else if(identityService.isAuthenticated()){
    <mat-icon [matTooltip]="identityService.myIdentityInfo()?.userName">
        account_circle
    </mat-icon>
    }
    @else {
    <mat-icon>account_circle_off</mat-icon>
    }
</button>
